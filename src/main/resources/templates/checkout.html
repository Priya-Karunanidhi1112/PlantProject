<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Checkout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
    }

    .checkout-box {
      max-width: 500px;
      margin: 50px auto;
      background: #f8f9fa;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    .checkout-header {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      color: #00b894;
      margin-bottom: 25px;
    }

    .form-check-input:checked {
      background-color: #00b894;
      border-color: #00b894;
    }

    .card-preview {
      padding: 1rem;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #e9ecef;
      margin-bottom: 1rem;
    }

    .card-preview h6 {
      font-family: monospace;
      color: #333;
    }

    .btn-place {
      background-color: #00b894;
      color: white;
      font-weight: bold;
    }

    .btn-place:hover {
      background-color: #019270;
    }
  </style>
</head>
<body>

<div class="checkout-box">
  <div class="checkout-header">💳 Checkout</div>

  <form method="post" th:action="@{/cart/checkout}">
    <!-- Payment Method -->
    <div class="mb-3">
      <label class="form-label">Select Payment Method</label>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="paymentMethod" id="methodCard" value="card" checked onchange="toggleCard()">
        <label class="form-check-label" for="methodCard">
          Debit/Credit Card
        </label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="paymentMethod" id="methodCOD" value="cod" onchange="toggleCard()">
        <label class="form-check-label" for="methodCOD">
          Cash on Delivery (COD)
        </label>
      </div>
    </div>

    <!-- Card Section -->
    <div id="cardSection">
      <div class="card-preview">
        <h6>🧾 Card Preview</h6>
        <p><strong>Name:</strong> <span id="previewName">----</span></p>
        <p><strong>Number:</strong> <span id="previewNumber">•••• •••• •••• ••••</span></p>
        <p><strong>Expiry:</strong> <span id="previewExpiry">MM/YY</span></p>
      </div>

      <div class="mb-3">
        <label>Card Holder Name</label>
        <input type="text" class="form-control" name="cardName" placeholder="John Doe"
               oninput="document.getElementById('previewName').textContent = this.value" required>
      </div>

      <div class="mb-3">
        <label>Card Number</label>
        <input type="text" class="form-control" name="cardNumber" maxlength="16" placeholder="4111 1111 1111 1111"
               oninput="document.getElementById('previewNumber').textContent = this.value" required>
      </div>

      <div class="row">
        <div class="col">
          <label>Expiry</label>
          <input type="text" class="form-control" name="expiry" placeholder="MM/YY"
                 oninput="document.getElementById('previewExpiry').textContent = this.value" required>
        </div>
        <div class="col">
          <label>CVV</label>
          <input type="text" class="form-control" name="cvv" maxlength="3" placeholder="123" required>
        </div>
      </div>
    </div>

    <!-- Submit -->
    <div class="text-end mt-4">
      <button type="submit" class="btn btn-place w-100">🔒 Place Order</button>
    </div>
  </form>
</div>

<script>
  function toggleCard() {
    const isCard = document.querySelector('input[name="paymentMethod"]:checked').value === 'card';
    const cardSection = document.getElementById('cardSection');
    cardSection.style.display = isCard ? 'block' : 'none';

    // Toggle required attributes
    const inputs = cardSection.querySelectorAll('input');
    inputs.forEach(input => {
      if (isCard) {
        input.setAttribute('required', 'required');
      } else {
        input.removeAttribute('required');
      }
    });
  }

  window.onload = toggleCard;
</script>


</body>
</html>
