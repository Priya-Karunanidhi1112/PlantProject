<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Your Cart</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .cart-container {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
    }

    .cart-items {
      flex: 2;
      overflow-y: auto;
      padding-right: 10px;
      height: 80vh; /* fixed height */
    }

    .cart-summary {
      flex: 1;
      background: #f8f9fa;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .summary-line.total {
      border-top: 1px solid #ccc;
      padding-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container mt-4">
  <div class="d-flex">
    <div class="col my-4">
      <a href="/" class="btn btn-outline-secondary">
        ⬅️ Back to Home
      </a>
    </div>
    <div class="col my-4">
      <h2 class="text-success mb-4">🛒 Your Cart</h2>
    </div>
  </div>


  <div th:if="${#lists.isEmpty(cartItems)}" class="alert alert-warning">
    Your cart is empty!
  </div>

  <div class="cart-container" th:if="${!#lists.isEmpty(cartItems)}">

    <!-- 🛍 Left Side - Cart Items -->
    <div class="cart-items">
      <div class="card mb-3" th:each="item : ${cartItems}">
        <div class="row g-0">
          <div class="col-md-2 p-1">
            <img th:src="@{/product/image/{id}(id=${item.id})}" class="img-fluid rounded-start" alt="Product Image" style="height: 100%; object-fit: cover;">
          </div>
          <div class="col-md-10">
            <div class="card-body d-flex justify-content-between align-items-center">
              <div>
                <h5 class="card-title" th:text="${item.name}">Product Name</h5>
                <p class="text-success mb-1">Price: ₹<span th:text="${item.price}">0</span></p>
                <form method="post" th:action="@{/cart/update}" class="d-flex align-items-center auto-submit-form">
                  <input type="hidden" name="id" th:value="${item.id}" />

                  <div class="input-group input-group-sm">
                    <button type="button" class="btn btn-outline-secondary" onclick="adjustQty(this, -1)">−</button>
                    <input type="number" name="quantity" min="1" th:value="${item.quantity}" class="form-control text-center" style="width: 60px;" />
                    <button type="button" class="btn btn-outline-secondary" onclick="adjustQty(this, 1)">+</button>
                  </div>
                </form>
              </div>
              <a th:href="@{/cart/remove/{id}(id=${item.id})}" class="btn btn-sm btn-outline-danger">🗑 Remove</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 📦 Right Side - Summary & Shipping -->
    <div class="cart-summary">
      <h5 class="text-primary mb-3">📃 Bill Summary</h5>

      <div class="summary-line">
        <span>Total Items</span>
        <span th:text="${cartItems.size()}">0</span>
      </div>
      <div class="summary-line">
        <span>Subtotal</span>
        <span>₹<span th:text="${total}">0</span></span>
      </div>
      <div class="summary-line">
        <span>Tax (5%)</span>
        <span>₹<span th:text="${total * 0.05}">0</span></span>
      </div>
      <div class="summary-line total">
        <span>Grand Total</span>
        <span>₹<span th:text="${total + (total * 0.05)}">0</span></span>
      </div>

      <hr>

      <!-- 🚚 Shipping Address View Mode -->
      <div id="shippingView" class="mb-3" th:if="${address != null}">
        <div class="d-flex justify-content-between align-items-center">
          <h6 class="mb-0">📍 Shipping Address</h6>
          <button class="btn btn-sm btn-outline-warning" onclick="toggleAddressEdit()">✏️ Edit</button>
        </div>
        <p class="mb-1"><strong>Name:</strong> <span id="viewName" th:text="${address.name}">N/A</span></p>
        <p class="mb-1"><strong>Street:</strong> <span id="viewStreet" th:text="${address.street}">N/A</span></p>
        <p class="mb-1"><strong>City:</strong> <span id="viewCity" th:text="${address.city}">N/A</span></p>
        <p class="mb-1"><strong>Pincode:</strong> <span id="viewPincode" th:text="${address.pincode}">N/A</span></p>
        <p class="mb-2"><strong>Phone:</strong> <span id="viewPhone" th:text="${address.phone}">N/A</span></p>
      </div>

      <!-- 📝 Shipping Address Edit Mode -->
      <form method="post" th:action="@{/cart/address}" id="addressEditForm" style="display:none;" th:if="${address != null}">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h6 class="mb-0">📬 Edit Address</h6>
          <div class="d-flex justify-content-around">
            <button type="submit" class="btn btn-success btn-sm me-1">💾edit</button>
            <button type="button" class="btn btn-secondary btn-sm" onclick="cancelEdit()">❌Cancel</button>
          </div>
        </div>
        <input type="text" class="form-control form-control-sm mb-2" name="name" th:value="${address.name}" placeholder="Name" required />
        <input type="text" class="form-control form-control-sm mb-2" name="street" th:value="${address.street}" placeholder="Street Address" required />
        <input type="text" class="form-control form-control-sm mb-2" name="city" th:value="${address.city}" placeholder="City" required />
        <input type="text" class="form-control form-control-sm mb-2" name="pincode" th:value="${address.pincode}" placeholder="Pincode" required />
        <input type="text" class="form-control form-control-sm mb-2" name="phone" th:value="${address.phone}" placeholder="Phone" required />
      </form>

      <!-- 🚫 No Address Yet -->
      <div th:if="${address == null}" class="mb-3">
        <h6>📬 Enter Shipping Address</h6>
        <form method="post" th:action="@{/cart/address}">
          <input type="text" class="form-control form-control-sm mb-2" name="name" placeholder="Name" required />
          <input type="text" class="form-control form-control-sm mb-2" name="street" placeholder="Street Address" required />
          <input type="text" class="form-control form-control-sm mb-2" name="city" placeholder="City" required />
          <input type="text" class="form-control form-control-sm mb-2" name="pincode" placeholder="Pincode" required />
          <input type="text" class="form-control form-control-sm mb-2" name="phone" placeholder="Phone" required />
          <button type="submit" class="btn btn-success btn-sm">💾 Save</button>
        </form>
      </div>


      <div class="text-end mt-4 mb-4">
        <form method="get" th:action="@{/checkout}">
          <button type="submit" class="btn btn-md btn-outline-success w-100 h-25">🛒 Proceed to Checkout</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- ✅ JS -->
<script>
  function toggleAddressEdit() {
    document.getElementById("shippingView").style.display = "none";
    document.getElementById("addressEditForm").style.display = "block";
  }

  function cancelEdit() {
    document.getElementById("addressEditForm").style.display = "none";
    document.getElementById("shippingView").style.display = "block";
  }

  function adjustQty(button, change) {
    const input = button.parentElement.querySelector("input[name='quantity']");
    let value = parseInt(input.value || 1);
    value = Math.max(1, value + change);
    input.value = value;

    const form = button.closest("form");
    if (form) form.submit();
  }
</script>


</body>
</html>
