<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="'Category: ' + ${selectedCategory}">Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 🔽 Hover dropdown show */
        .dropdown:hover .dropdown-menu {
          display: block;
          margin-top: 0;
        }
    </style>
</head>
<body>

<!-- ✅ Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">
    <h2 class="mb-4 text-success" th:text="'Category: ' + ${selectedCategory}"></h2>

    <div class="row" >
        <div class="col-md-4 mb-4" th:if="${products.size() > 0}" th:each="product : ${products}">
            <div class="card h-100 shadow-sm">
                <img th:src="@{/product/image/{id}(id=${product.id})}" class="card-img-top" style="height: 180px; object-fit: cover;">

                <div class="card-body d-flex flex-column justify-content-between">
                    <h5 class="card-title" th:text="${product.name}"></h5>

                    <p class="card-text">
                        <span class="text-muted text-decoration-line-through">₹<span th:text="${product.price + 100}"></span></span> <!-- Fake MRP -->
                        <span class="fw-bold text-success ms-2">₹<span th:text="${product.price}"></span></span>
                    </p>

                    <div class="mt-auto text-end">
                        <form th:action="@{/cart/add}" method="post">
                            <input type="hidden" name="productId" th:value="${product.id}" />
                            <button type="submit" class="btn btn-success btn-sm w-100">🛒 Add to Cart</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${products.size() == 0}">
        <p class="text-danger">No products found in this category.</p>
    </div>
</div>

</body>
</html>
