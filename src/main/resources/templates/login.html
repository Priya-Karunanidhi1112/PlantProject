<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login | Planting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 bg-white p-4 rounded shadow-sm">
            <h3 class="text-center mb-4">Login to Your Account</h3>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label>Email</label>
                    <input type="email" name="username" class="form-control" placeholder="you@example.com" required />
                </div>

                <div class="mb-3">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required />
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary">Login</button>
                </div>

                <p class="text-center">Don't have an account?
                    <a th:href="@{/register}">Register here</a>
                </p>

                <!-- Success message -->
                <div class="alert alert-success mt-3" th:if="${param.success}">
                    Registered successfully. Please login!
                </div>

                <!-- Logout message -->
                <div class="alert alert-info mt-3" th:if="${param.logout}">
                    You have been logged out.
                </div>

                <!-- Login error -->
                <div class="alert alert-danger mt-3" th:if="${param.error}">
                    Invalid email or password.
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
