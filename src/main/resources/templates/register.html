<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register | Planting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 bg-white p-4 rounded shadow-sm">
            <h3 class="text-center mb-4">Create an Account</h3>

            <form th:action="@{/register}" method="post" th:object="${user}">
                <div class="mb-3">
                    <label>Name</label>
                    <input type="text" class="form-control" th:field="*{name}" placeholder="Your Name" required />
                </div>
                <div class="mb-3">
                    <label>Email</label>
                    <input type="email" class="form-control" th:field="*{email}" placeholder="you@example.com" required />
                </div>
                <div class="mb-3">
                    <label>Password</label>
                    <input type="password" class="form-control" th:field="*{password}" placeholder="Enter password" required />
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-success">Register</button>
                </div>

                <p class="text-center">Already have an account?
                    <a th:href="@{/login}">Login</a>
                </p>

                <!-- Show error -->
                <div class="alert alert-danger mt-3" th:if="${error}" th:text="${error}"></div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
