<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
<!-- fragments/navbar.html -->
<div th:fragment="navbar">
    <nav class="navbar navbar-expand-lg bg-white navbar-light shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-success" th:href="@{/}">🌿 Planting</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-success" href="#" role="button" data-bs-toggle="dropdown">
                            Categories
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" th:href="@{/category/Balcony Garden}">Balcony Garden</a></li>
                            <li><a class="dropdown-item" th:href="@{/category/Living Garden}">Living Garden</a></li>
                            <li><a class="dropdown-item" th:href="@{/category/Terrace Garden}">Terrace Garden</a></li>
                            <li><a class="dropdown-item" th:href="@{/category/Kitchen Garden}">Kitchen Garden</a></li>
                        </ul>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-success" href="#" role="button" data-bs-toggle="dropdown">
                            Planters
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" th:href="@{/category/Resin Pots}">Resin Pots</a></li>
                            <li><a class="dropdown-item" th:href="@{/category/Self Watering Pots}">Self Watering Pots</a></li>
                            <li><a class="dropdown-item" th:href="@{/category/Plastic Pots}">Plastic Pots</a></li>
                            <li><a class="dropdown-item" th:href="@{/category/Ceramic Pots}">Ceramic Pots</a></li>
                        </ul>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item me-3" sec:authorize="isAuthenticated()">
                        <a class="nav-link text-dark">
                            <strong th:text="'👋 ' + ${#authentication.name}">Username</strong>
                        </a>
                    </li>
                    <li>
                        <a class="nav-link position-relative me-3" th:href="@{/cart}">
                            🛒 Cart
<!--                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"-->
<!--                                  th:text="${session.cart != null ? session.cart.size() : 0}">0</span>-->
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="btn btn-outline-success">Logout</button>
                        </form>
                    </li>
                    <li class="nav-item" sec:authorize="isAnonymous()">
                        <a class="btn btn-outline-primary" th:href="@{/login}">Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</div>
</body>
</html>
